<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góc Trà Sữa - Thêm Khách Hàng Mới</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        brand: { 50: '#fffbeb', 100: '#fef3c7', 500: '#f59e0b', 600: '#d97706', 700: '#b45309' } 
                    } 
                } 
            } 
        }
    </script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased flex h-screen overflow-hidden text-lg">
    <!-- Sidebar cố định -->
    <aside class="w-72 bg-slate-900 text-slate-300 flex flex-col justify-between hidden md:flex shadow-2xl flex-shrink-0 h-screen sticky top-0">
        <div>
            <div class="h-20 flex items-center justify-center gap-4 px-8 bg-slate-950 border-b border-slate-800">
             
                <span class="font-bold text-xl text-white tracking-wide text-center">Góc Trà Sữa</span>
            </div>
            <nav class="p-6 space-y-2">
                <a href="index.html" class="flex items-center gap-4 px-5 py-4 text-slate-400 hover:bg-slate-800 hover:text-white rounded-2xl font-semibold text-lg transition"><i class="fa-solid fa-chart-pie w-6 text-xl"></i><span>Tổng Quan</span></a>
                <a href="products.html" class="flex items-center gap-4 px-5 py-4 text-slate-400 hover:bg-slate-800 hover:text-white rounded-2xl font-semibold text-lg transition"><i class="fa-solid fa-wine-glass-empty w-6 text-xl"></i><span>Sản Phẩm</span></a>
                <a href="orders.html" class="flex items-center gap-4 px-5 py-4 text-slate-400 hover:bg-slate-800 hover:text-white rounded-2xl font-semibold text-lg transition"><i class="fa-solid fa-receipt w-6 text-xl"></i><span>Đơn Hàng</span></a>
                <a href="customers.html" class="flex items-center gap-4 px-5 py-4 bg-brand-600 text-white rounded-2xl font-bold text-lg shadow-md"><i class="fa-solid fa-users w-6 text-xl"></i><span>Khách Hàng</span></a>
            </nav>
        </div>
        <div class="p-6 border-t border-slate-800">
            <a href="login.html" class="flex items-center gap-4 px-5 py-3.5 text-rose-400 hover:bg-rose-500/10 rounded-2xl font-bold text-lg transition"><i class="fa-solid fa-right-from-bracket w-6 text-xl"></i><span>Đăng Xuất</span></a>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0 h-screen overflow-y-auto">
        <header class="h-20 bg-white border-b border-slate-200 px-8 flex items-center justify-between shadow-xs flex-shrink-0">
            <h1 class="text-2xl md:text-3xl font-extrabold text-slate-800 flex items-center gap-3">
                <i class="fa-solid fa-user-plus text-brand-600"></i> Thêm Khách Hàng Mới
            </h1>
            <a href="customers.html" class="text-base text-slate-600 bg-slate-100 px-5 py-3 rounded-xl font-bold hover:bg-slate-200 transition flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Quay lại
            </a>
        </header>

        <main class="p-8">
            <div class="max-w-2xl bg-white rounded-3xl border border-slate-200 shadow-sm p-8 mx-auto">
                <form action="customers.html" method="GET" class="space-y-6">
                    <div>
                        <label class="block text-base font-bold text-slate-700 uppercase mb-2">Họ và tên khách hàng</label>
                        <input type="text" required placeholder="Ví dụ: Nguyễn Văn A" class="w-full px-5 py-3.5 border border-slate-200 rounded-2xl text-base focus:outline-none focus:border-brand-500">
                    </div>

                    <div>
                        <label class="block text-base font-bold text-slate-700 uppercase mb-2">Số điện thoại</label>
                        <input type="tel" required placeholder="Ví dụ: 0901234567" class="w-full px-5 py-3.5 border border-slate-200 rounded-2xl text-base focus:outline-none focus:border-brand-500">
                    </div>

                    <div>
                        <label class="block text-base font-bold text-slate-700 uppercase mb-2">Email (Tùy chọn)</label>
                        <input type="email" placeholder="khachhang@gmail.com" class="w-full px-5 py-3.5 border border-slate-200 rounded-2xl text-base focus:outline-none focus:border-brand-500">
                    </div>

                    <div>
                        <label class="block text-base font-bold text-slate-700 uppercase mb-2">Hạng thành viên khởi tạo</label>
                        <select class="w-full px-5 py-3.5 border border-slate-200 rounded-2xl text-base focus:outline-none focus:border-brand-500">
                            <option value="Đồng">Đồng</option>
                            <option value="Bạc">Bạc</option>
                            <option value="Vàng">Vàng</option>
                            <option value="Kim Cương">Kim Cương</option>
                        </select>
                    </div>

                    <div class="flex gap-4 pt-4">
                        <a href="customers.html" class="flex-1 py-3.5 text-center border border-slate-200 text-slate-600 rounded-2xl text-base font-bold hover:bg-slate-50 transition">Hủy bỏ</a>
                        <button type="submit" class="flex-1 py-3.5 bg-brand-600 hover:bg-brand-700 text-white rounded-2xl text-base font-bold shadow-md transition">Lưu khách hàng</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
