<!DOCTYPE html>
<html lang="vi" class="text-[14px] lg:text-[15px]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góc Trà Sữa - Thêm Khách Hàng Mới</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        brand: { 50: '#fffbeb', 100: '#fef3c7', 500: '#f59e0b', 600: '#d97706', 700: '#b45309' } 
                    } 
                } 
            } 
        }
    </script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased flex h-screen overflow-hidden">
    <!-- Sidebar cố định -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between hidden md:flex shadow-2xl flex-shrink-0 h-screen sticky top-0">
        <div>
            <!-- Logo chuẩn theo ảnh mẫu -->
            <div class="h-20 flex flex-col items-center justify-center px-4 bg-[#71370F] border-b border-[#5a2c0c] text-center">
                <div class="font-black text-lg tracking-wide">
                    <span class="text-white">Góc</span> <span class="text-[#ffe4b5]">Tea</span>
                </div>
                <div class="text-[11px] font-semibold text-[#fef08a] tracking-wider uppercase mt-0.5">Boba & Coffee</div>
            </div>
            <nav class="p-4 space-y-1.5">
                <a href="index.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl font-semibold transition"><i class="fa-solid fa-chart-pie w-5 text-lg"></i><span>Tổng Quan</span></a>
                <a href="products.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl font-semibold transition"><i class="fa-solid fa-wine-glass-empty w-5 text-lg"></i><span>Sản Phẩm</span></a>
                <a href="orders.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl font-semibold transition"><i class="fa-solid fa-receipt w-5 text-lg"></i><span>Đơn Hàng</span></a>
                <a href="customers.html" class="flex items-center gap-3 px-4 py-3 bg-brand-600 text-white rounded-xl font-bold shadow-md"><i class="fa-solid fa-users w-5 text-lg"></i><span>Khách Hàng</span></a>
            </nav>
        </div>
        <div class="p-4 border-t border-slate-800">
            <a href="login.html" class="flex items-center gap-3 px-4 py-3 text-rose-400 hover:bg-rose-500/10 rounded-xl font-bold transition"><i class="fa-solid fa-right-from-bracket w-5 text-lg"></i><span>Đăng Xuất</span></a>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0 h-screen overflow-y-auto">
        <header class="h-20 bg-white border-b border-slate-200 px-6 flex items-center justify-between shadow-xs flex-shrink-0">
            <h1 class="text-xl md:text-2xl font-extrabold text-slate-800 flex items-center gap-2.5">
                <i class="fa-solid fa-user-plus text-brand-600"></i> Thêm Khách Hàng Mới
            </h1>
            <a href="customers.html" class="text-xs text-slate-600 bg-slate-100 px-4 py-2.5 rounded-xl font-bold hover:bg-slate-200 transition flex items-center gap-1.5">
                <i class="fa-solid fa-arrow-left"></i> Quay lại
            </a>
        </header>

        <main class="p-6">
            <div class="max-w-xl bg-white rounded-2xl border border-slate-200 shadow-sm p-6 mx-auto">
                <form action="customers.html" method="GET" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Họ và tên khách hàng</label>
                        <input type="text" placeholder="Ví dụ: Nguyễn Văn A" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Số điện thoại</label>
                        <input type="tel" placeholder="Ví dụ: 0901234567" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Email</label>
                        <input type="email" placeholder="khachhang@gmail.com" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Địa chỉ</label>
                        <input type="text" placeholder="Ví dụ: 123 An Dương Vương, TP.HCM" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Mật khẩu</label>
                        <input type="password" placeholder="Nhập mật khẩu tài khoản" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Hạng thành viên khởi tạo</label>
                        <select class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500">
                            <option value="Đồng">Đồng</option>
                            <option value="Bạc">Bạc</option>
                            <option value="Vàng">Vàng</option>
                            <option value="Kim Cương">Kim Cương</option>
                        </select>
                    </div>
                    <div class="flex gap-3 pt-3">
                        <a href="customers.html" class="flex-1 py-2.5 text-center border border-slate-200 text-slate-600 rounded-xl text-sm font-bold hover:bg-slate-50 transition">Hủy bỏ</a>
                        <button type="submit" class="flex-1 py-2.5 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-sm font-bold shadow-md transition">Lưu khách hàng</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
