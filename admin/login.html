<!DOCTYPE html>
<html lang="vi" class="text-[14px] lg:text-[15px]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góc Trà Sữa - Đăng Nhập & Đăng Ký</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { brand: { 50: '#fffbeb', 100: '#fef3c7', 500: '#f59e0b', 600: '#d97706', 700: '#b45309' } } } }
        }
    </script>
</head>
<body class="bg-amber-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-amber-100">
        <!-- Logo chuẩn theo ảnh mẫu -->
        <div class="bg-[#71370F] p-6 text-center text-white border-b border-[#5a2c0c]">
            <div class="font-black text-2xl tracking-wide">
                <span class="text-white">Góc</span> <span class="text-[#ffe4b5]">Tea</span>
            </div>
            <div class="text-xs font-semibold text-[#fef08a] tracking-wider uppercase mt-1">Boba & Coffee Admin</div>
        </div>
        <div class="flex border-b border-gray-200 bg-amber-50/50">
            <button id="tab-login-btn" onclick="switchTab('login')" class="flex-1 py-3 text-center text-xs font-semibold border-b-2 border-brand-600 text-brand-600 transition">Đăng Nhập</button>
            <button id="tab-register-btn" onclick="switchTab('register')" class="flex-1 py-3 text-center text-xs font-semibold text-gray-500 hover:text-brand-600 border-b-2 border-transparent transition">Đăng Ký</button>
        </div>
        <div class="p-6">
            <form action="index.html" id="form-login" class="space-y-4">
                <div>
                    <label class="block text-[11px] font-semibold text-gray-600 uppercase mb-1">Tài khoản</label>
                    <input type="text" placeholder="admin@goctrasua.vn" class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-gray-600 uppercase mb-1">Mật khẩu</label>
                    <input type="password" placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-brand-500">
                </div>
                <button type="submit" class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm rounded-xl shadow-md transition">Đăng Nhập Hệ Thống</button>
            </form>
            <form action="index.html" id="form-register" class="space-y-4 hidden">
                <div>
                    <label class="block text-[11px] font-semibold text-gray-600 uppercase mb-1">Email</label>
                    <input type="email" placeholder="nhanvien@goctrasua.vn" class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-gray-600 uppercase mb-1">Mật khẩu</label>
                    <input type="password" placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-gray-600 uppercase mb-1">Nhập lại mật khẩu</label>
                    <input type="password" placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-brand-500">
                </div>
                <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm rounded-xl shadow-md transition">Đăng Ký Tài Khoản</button>
            </form>
        </div>
    </div>
    <script>
        function switchTab(tab) {
            if (tab === 'login') {
                document.getElementById('form-login').classList.remove('hidden');
                document.getElementById('form-register').classList.add('hidden');
                document.getElementById('tab-login-btn').className = "flex-1 py-3 text-center text-xs font-semibold border-b-2 border-brand-600 text-brand-600 transition";
                document.getElementById('tab-register-btn').className = "flex-1 py-3 text-center text-xs font-semibold text-gray-500 border-b-2 border-transparent transition";
            } else {
                document.getElementById('form-login').classList.add('hidden');
                document.getElementById('form-register').classList.remove('hidden');
                document.getElementById('tab-register-btn').className = "flex-1 py-3 text-center text-xs font-semibold border-b-2 border-emerald-600 text-emerald-600 transition";
                document.getElementById('tab-login-btn').className = "flex-1 py-3 text-center text-xs font-semibold text-gray-500 border-b-2 border-transparent transition";
            }
        }
    </script>
</body>
</html>
